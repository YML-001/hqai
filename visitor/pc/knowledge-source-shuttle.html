<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>知识来源 · 七、交通出行服务 · 班车查询 · 中南大学后勤智能助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { corePlugins: { preflight: false } };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      :root {
        --blue: #2873ed;
        --navy: #173d75;
        --pale: #edf4ff;
        --bg: #f3f6fb;
        --ink: #233249;
        --muted: #7c889a;
        --line: #e6ebf3;
        --green: #159b7d;
        --amber: #b97921;
        --red: #d15454;
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        font-size: 14px;
        line-height: 1.65;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      a,
      button {
        transition:
          background 0.18s,
          transform 0.18s,
          border-color 0.18s;
      }
      a:hover {
        color: var(--blue);
      }
      a:focus-visible,
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid #92baff;
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        font-size: 29px;
        letter-spacing: -0.7px;
        line-height: 1.35;
        margin-bottom: 10px;
      }
      h2 {
        font-size: 17px;
        margin-bottom: 19px;
      }
      h3 {
        font-size: 15px;
        margin-bottom: 9px;
      }
      p {
        color: #66758a;
      }
      small,
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        color: var(--navy);
      }
      .brand strong {
        font-family: "Songti SC", "SimSun", serif;
        font-size: 23px;
        letter-spacing: 3px;
      }
      .brand span {
        display: block;
        font-size: 11px;
        letter-spacing: 2px;
        color: #7188a5;
      }
      .brand-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid #8ca6c6;
        border-radius: 50%;
        font-size: 22px;
      }
      .topbar {
        height: 84px;
        padding: 0 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #fff;
        border-bottom: 1px solid var(--line);
        gap: 18px;
      }
      .toplinks {
        display: flex;
        align-items: center;
        gap: 23px;
        font-size: 13px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #e5efff;
        display: inline-grid;
        place-items: center;
        color: var(--blue);
        font-weight: 600;
      }
      .shell {
        display: grid;
        grid-template-columns: 228px minmax(0, 1fr);
        min-height: calc(100vh - 84px);
      }
      .sidebar {
        padding: 25px 17px;
        background: #fff;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .sidebar .section-label {
        padding: 15px 14px 4px;
        color: #98a2b2;
        font-size: 11px;
        letter-spacing: 2px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 10px;
        padding: 12px 14px;
        color: #6d7b8e;
      }
      .nav-item.active {
        background: var(--pale);
        color: var(--blue);
        font-weight: 600;
      }
      .nav-item:hover {
        background: #f5f8fd;
      }
      .sidebar .help {
        margin-top: auto;
        background: #f6f9fe;
        padding: 15px;
        border-radius: 12px;
        font-size: 12px;
      }
      .main {
        min-width: 0;
        padding: 32px 36px 46px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 25px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 2px;
        color: #8293ad;
        margin-bottom: 9px;
      }
      .page-heading p {
        margin: 0;
        font-size: 13px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 17px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fff;
        color: #53657f;
        white-space: nowrap;
        font-weight: 500;
      }
      .btn:hover {
        border-color: #a4c1ef;
        background: #f4f8ff;
      }
      .btn.primary {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
        box-shadow: 0 4px 9px #2873ed17;
      }
      .btn.danger {
        color: var(--red);
        border-color: #f0d0d0;
      }
      .btn.sm {
        font-size: 12px;
        padding: 6px 11px;
      }
      .textlink {
        color: var(--blue);
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 20px;
      }
      .card h2:last-child {
        margin-bottom: 0;
      }
      .grid2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .grid4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }
      .badge {
        display: inline-block;
        background: #edf4ff;
        color: #4274b8;
        border-radius: 5px;
        padding: 3px 8px;
        font-size: 11px;
        white-space: nowrap;
      }
      .badge.green {
        color: var(--green);
        background: #eaf8f2;
      }
      .badge.amber {
        color: var(--amber);
        background: #fff6e7;
      }
      .badge.red {
        color: var(--red);
        background: #fff0f0;
      }
      .badge.gray {
        color: #7e8b9c;
        background: #f0f3f7;
      }
      .note {
        display: flex;
        gap: 10px;
        background: #edf4ff;
        border: 1px solid #dce9ff;
        color: #5c779b;
        border-radius: 10px;
        padding: 13px 16px;
        font-size: 12px;
        margin-bottom: 20px;
      }
      .note.amber {
        background: #fff8ed;
        border-color: #f4e5c8;
        color: #9f783c;
      }
      .note i {
        margin-top: 4px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        padding: 20px;
        border-radius: 14px;
      }
      .stat b {
        display: block;
        font-size: 30px;
        margin: 7px 0 2px;
        font-weight: 600;
        letter-spacing: -1px;
      }
      .stat .trend {
        font-size: 11px;
        color: var(--green);
      }
      .table-wrap {
        width: 100%;
        overflow: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        text-align: left;
        font-size: 12px;
      }
      th {
        background: #f7f9fc;
        color: #8692a3;
        font-weight: 500;
        padding: 13px 14px;
        white-space: nowrap;
      }
      td {
        padding: 17px 14px;
        border-bottom: 1px solid #eff2f7;
        vertical-align: middle;
      }
      td p {
        margin: 3px 0 0;
        font-size: 11px;
      }
      tbody tr:hover {
        background: #fafcff;
      }
      td .textlink + .textlink {
        margin-left: 14px;
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #dfe5ee;
        background: white;
        border-radius: 8px;
        padding: 11px 12px;
        color: var(--ink);
        min-width: 0;
      }
      textarea {
        resize: vertical;
      }
      input::placeholder,
      textarea::placeholder {
        color: #a0aaba;
      }
      .filters input {
        width: 260px;
      }
      .filters select {
        width: 160px;
      }
      .field {
        margin-bottom: 20px;
      }
      .field label {
        display: block;
        margin-bottom: 8px;
        color: #526179;
        font-size: 13px;
      }
      .field em {
        font-style: normal;
        color: var(--red);
      }
      .field small {
        display: block;
        margin-top: 6px;
      }
      .form-actions {
        border-top: 1px solid var(--line);
        padding-top: 22px;
        display: flex;
        gap: 12px;
        justify-content: flex-end;
      }
      .form-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 22px;
      }
      .summary-list {
        margin: 0;
      }
      .summary-list div {
        display: grid;
        grid-template-columns: 105px minmax(0, 1fr);
        gap: 15px;
        padding: 14px 0;
        border-bottom: 1px solid #f0f3f7;
      }
      .summary-list dt {
        color: #8a95a6;
      }
      .summary-list dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .timeline {
        padding-left: 22px;
      }
      .timeline li {
        padding: 0 0 25px 22px;
        border-left: 1px solid #dbe7f8;
        position: relative;
        list-style: none;
      }
      .timeline li:before {
        content: "";
        position: absolute;
        left: -5px;
        top: 5px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 4px #eef4ff;
      }
      .timeline p {
        margin: 5px 0 0;
        font-size: 12px;
      }
      .hero {
        background: linear-gradient(115deg, #e7f0ff, #f7faff 70%);
        border: 1px solid #e0eafb;
        border-radius: 22px;
        padding: 30px;
        position: relative;
        overflow: hidden;
        margin-bottom: 24px;
      }
      .hero h1 {
        color: #21487e;
        font-size: 30px;
      }
      .hero p {
        max-width: 620px;
        color: #6980a0;
      }
      .hero .hero-art {
        position: absolute;
        right: 20px;
        bottom: -15px;
        font-size: 145px;
        color: #bad2fa;
        opacity: 0.5;
        transform: rotate(-12deg);
      }
      .service-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        padding: 23px;
        display: block;
        position: relative;
      }
      .service-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px #38629b0b;
        border-color: #b4cef6;
      }
      .service-icon {
        height: 42px;
        width: 42px;
        display: grid;
        place-items: center;
        background: #edf4ff;
        border-radius: 12px;
        font-size: 18px;
        color: var(--blue);
        margin-bottom: 18px;
      }
      .service-card h3 {
        margin: 0 0 7px;
      }
      .service-card p {
        font-size: 12px;
        min-height: 40px;
        margin-bottom: 14px;
      }
      .list-row {
        padding: 17px 0;
        border-bottom: 1px solid #eff2f7;
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: center;
      }
      .list-row:last-child {
        border: 0;
      }
      .list-row h3 {
        margin-bottom: 4px;
      }
      .list-row p {
        margin: 0;
        font-size: 12px;
      }
      .row-chevron {
        color: #a6b5c9;
      }
      .chat-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 285px;
        gap: 24px;
        min-height: 700px;
      }
      .chat-main {
        min-width: 0;
      }
      .welcome {
        padding: 26px 30px 22px;
        border-radius: 20px;
        background: linear-gradient(110deg, #3b83f1, #88baff);
        color: #fff;
        position: relative;
        overflow: hidden;
        min-height: 165px;
      }
      .welcome h1 {
        color: #fff;
        font-size: 27px;
      }
      .welcome p {
        color: #e7f0ff;
        margin-bottom: 0;
        max-width: 85%;
      }
      .welcome .watermark {
        position: absolute;
        right: 20px;
        top: 30px;
        font-size: 75px;
        color: #ffffff44;
      }
      .quick-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 20px 0;
      }
      .quick {
        padding: 15px 5px;
        text-align: center;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 12px;
      }
      .quick i {
        display: block;
        color: var(--blue);
        font-size: 20px;
        margin-bottom: 10px;
      }
      .question-list {
        padding: 8px 0;
      }
      .question {
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid #f0f3f7;
        padding: 13px 0;
        font-size: 13px;
      }
      .question:last-child {
        border: 0;
      }
      .question .number {
        font-size: 12px;
        color: #7d9cca;
        background: #f2f6fd;
        border-radius: 6px;
        width: 23px;
        text-align: center;
      }
      .question:first-child .number {
        color: #e89059;
        background: #fff3eb;
      }
      .question .fa-arrow-up {
        margin-left: auto;
        font-size: 11px;
        color: #a0b0c6;
        transform: rotate(45deg);
      }
      .small-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .small-heading h2 {
        margin: 0;
      }
      .small-heading + .question-list {
        margin-top: 12px;
      }
      .composer {
        border: 1px solid #d8e5fa;
        box-shadow: 0 5px 22px #5b8ac10a;
        padding: 17px;
        border-radius: 16px;
        background: #fff;
        margin-top: 24px;
      }
      .composer textarea {
        border: 0;
        padding: 4px;
        min-height: 85px;
        resize: none;
        outline: none;
      }
      .composer-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .composer-tools {
        display: flex;
        gap: 8px;
      }
      .composer-tools .btn {
        border: 0;
        padding: 7px;
        background: #f8faff;
      }
      .safe-footer {
        text-align: center;
        color: #a0adbe;
        font-size: 11px;
        margin-top: 12px;
      }
      .companion {
        text-align: center;
        background: linear-gradient(#f0f6ff, #fff);
        border: 1px solid var(--line);
        padding: 22px;
        border-radius: 16px;
        margin-bottom: 20px;
      }
      .portrait {
        width: 106px;
        height: 116px;
        border-radius: 55px 55px 32px 32px;
        object-fit: cover;
        object-position: 50% 20%;
        border: 6px solid #fff;
        box-shadow: 0 8px 20px #a1bce43b;
        margin: 10px auto;
      }
      .companion h3 {
        margin-bottom: 5px;
      }
      .companion p {
        font-size: 12px;
        margin-bottom: 12px;
      }
      .contact-box {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 22px;
        margin-bottom: 20px;
      }
      .contact-box h2 {
        font-size: 14px;
      }
      .contact-box .phone {
        font-size: 20px;
        font-weight: 600;
        color: var(--navy);
        display: block;
        margin: 8px 0;
      }
      .contact-box p {
        font-size: 12px;
      }
      .mini-apps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px 5px;
        text-align: center;
        font-size: 11px;
      }
      .mini-apps i {
        display: block;
        margin-bottom: 8px;
        color: var(--blue);
        font-size: 21px;
      }
      .bubble-user {
        background: #e9f1ff;
        padding: 15px 20px;
        border-radius: 16px 16px 4px 16px;
        max-width: 80%;
        margin: 0 0 25px auto;
        width: fit-content;
      }
      .answer {
        background: #fff;
        padding: 26px;
        border: 1px solid var(--line);
        border-radius: 16px;
      }
      .answer .answer-label {
        font-size: 12px;
        color: var(--blue);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .answer p {
        color: #4d5c72;
        font-size: 14px;
        line-height: 1.9;
      }
      .source {
        border: 1px solid #e5ebf6;
        background: #f8faff;
        border-radius: 9px;
        display: block;
        padding: 12px;
        margin: 19px 0;
        font-size: 12px;
        color: #6a83a7;
      }
      .answer-actions {
        display: flex;
        gap: 9px;
        margin-top: 18px;
        border-top: 1px solid var(--line);
        padding-top: 15px;
      }
      .answer-actions .btn {
        font-size: 12px;
        padding: 6px 10px;
      }
      .split-detail {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 22px;
      }
      .steps {
        counter-reset: item;
        display: grid;
        gap: 21px;
      }
      .step {
        display: flex;
        gap: 15px;
      }
      .step > span {
        width: 29px;
        height: 29px;
        border-radius: 50%;
        background: #edf4ff;
        color: var(--blue);
        display: grid;
        place-items: center;
        flex-shrink: 0;
      }
      .step p {
        font-size: 13px;
        margin: 5px 0 0;
      }
      .detail-banner {
        display: flex;
        gap: 20px;
        align-items: center;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 25px;
      }
      .detail-banner .service-icon {
        width: 60px;
        height: 60px;
        font-size: 25px;
        margin: 0;
      }
      .detail-banner h1 {
        font-size: 25px;
      }
      .detail-banner p {
        margin: 0;
      }
      .success {
        text-align: center;
        padding: 40px 20px;
      }
      .success-mark {
        display: grid;
        place-items: center;
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: #e9f8f2;
        color: var(--green);
        font-size: 28px;
        margin: 0 auto 22px;
      }
      .success h1 {
        font-size: 26px;
      }
      .success p {
        max-width: 570px;
        margin: 0 auto 25px;
      }
      .qr {
        width: 190px;
        height: 190px;
        padding: 10px;
        background: #fff;
        margin: 20px auto;
        border: 1px solid var(--line);
      }
      .qr img {
        width: 100%;
        height: 100%;
      }
      .qr-caption {
        font-size: 12px;
        text-align: center;
        word-break: break-all;
      }
      .cover {
        height: 170px;
        width: 100%;
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 20px;
      }
      .tabs {
        display: flex;
        gap: 25px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
      }
      .tabs a {
        padding: 12px 3px;
        color: #8a96a8;
        font-size: 13px;
      }
      .tabs a.active {
        border-bottom: 2px solid var(--blue);
        color: var(--blue);
      }
      .chart {
        width: 100%;
        height: 210px;
      }
      .bars {
        display: flex;
        gap: 20px;
        align-items: flex-end;
        height: 150px;
        border-bottom: 1px solid var(--line);
        padding: 0 12px;
        margin: 18px 0 28px;
      }
      .bars div {
        flex: 1;
        position: relative;
        background: #76a7f6;
        border-radius: 5px 5px 0 0;
        min-width: 12px;
      }
      .bars span {
        position: absolute;
        bottom: -27px;
        font-size: 10px;
        white-space: nowrap;
        left: 50%;
        transform: translateX(-50%);
        color: #95a0b1;
      }
      .progress {
        height: 7px;
        background: #eff3f9;
        border-radius: 5px;
        margin: 8px 0 17px;
        overflow: hidden;
      }
      .progress span {
        height: 100%;
        display: block;
        background: var(--blue);
        border-radius: 5px;
      }
      .guide-wrap {
        max-width: 1240px;
        margin: auto;
        padding: 32px;
      }
      .guide-hero {

    <script>
      function toast(text) {
        let n = document.createElement("div");
        n.className = "toast";
        n.setAttribute("role", "status");
        n.textContent = text;
        document.body.append(n);
        setTimeout(() => n.remove(), 3000);
      }
      function storageName(key) {
        return (
          "csu-prototype-" +
          key +
          (key === "question" ? "-" + document.body.dataset.role : "")
        );
      }
      function store(key, value) {
        try {
          localStorage.setItem(storageName(key), JSON.stringify(value));
        } catch (e) {}
      }
      function read(key) {
        try {
          return JSON.parse(localStorage.getItem(storageName(key)) || "null");
        } catch (e) {
          return null;
        }
      }
      function needsPersonalInfo(q) {
        const how = /怎么|如何|哪里|在哪|流程|方法|指引/.test(q);
        return (
          !how &&
          (/我是谁|我叫什么/.test(q) ||
            (/我的|本人|个人|我住|帮我查|查我/.test(q) &&
              /余额|用量|欠费|账单|缴费记录|报修|进度|房间|宿舍|学号|工号|姓名|身份|信息|会议|通知/.test(
                q,
              )) ||
            (/查询|查看|查一下|查查|多少|剩余/.test(q) &&
              /余额|欠费|用量|账单|缴费记录|报修进度|学号|工号/.test(q)))
        );
      }
      document
        .querySelectorAll("[data-toast]")
        .forEach((b) =>
          b.addEventListener("click", () => toast(b.dataset.toast)),
        );
      document.querySelectorAll("[data-filter]").forEach((b) =>
        b.addEventListener("input", () => {
          let q = b.value.trim().toLowerCase();
          let visible = 0;
          document.querySelectorAll("[data-row]").forEach((r) => {
            let show = r.textContent.toLowerCase().includes(q);
            r.classList.toggle("hide", !show);
            if (show) visible++;
          });
          let empty = document.querySelector("[data-empty]");
          if (empty) empty.classList.toggle("hide", visible > 0);
        }),
      );
      document.querySelectorAll("form[data-save]").forEach((f) => {
        let d = read(f.dataset.save);
        if (d)
          f.querySelectorAll("input,textarea,select").forEach((n) => {
            if (n.name in d && n.type !== "checkbox") n.value = d[n.name];
          });
      });
      document.querySelectorAll("form[data-save]").forEach((f) =>
        f.addEventListener("submit", (e) => {
          e.preventDefault();
          const data = Object.fromEntries(new FormData(f));
          store(f.dataset.save, data);
          location.href = f.getAttribute("action");
        }),
      );
      document.querySelectorAll("[data-bind]").forEach((n) => {
        let [key, field] = n.dataset.bind.split(".");
        let d = read(key);
        if (d && d[field])
          n.textContent = String(d[field]).replace(
            /(\d{4}-\d{2}-\d{2})T/,
            "$1 ",
          );
      });
      document.querySelectorAll("[data-value]").forEach((n) => {
        let [key, field] = n.dataset.value.split(".");
        let d = read(key);
        if (d && d[field]) n.value = d[field];
      });
      document.querySelectorAll("[data-submit-chat]").forEach((f) =>
        f.addEventListener("submit", (e) => {
          e.preventDefault();
          let q = new FormData(f).get("question").trim();
          if (!q) return;
          store("question", { text: q });
          const guest = document.body.dataset.role === "visitor";
          let target = needsPersonalInfo(q)
            ? guest
              ? "login-required.html?intent=personal"
              : "chat-personal.html"
            : /报修|坏|空调|门锁|漏/.test(q)
              ? "chat-repair.html"
              : /水|电|充值|余额/.test(q)
                ? "chat.html"
                : /班车|公交|校车/.test(q)
                  ? "chat-shuttle.html"
                  : guest && /游泳|场馆|预约/.test(q)
                    ? "chat-pool.html"
                    : guest && /投诉|建议|监督/.test(q)
                      ? "chat-supervision.html"
                      : /故障演示|连接失败/.test(q)
                        ? "chat-error.html"
                        : "chat-fallback.html";
          location.href = target;
        }),
      );
      document
        .querySelectorAll(
          "a.question,a.list-row[href^=chat],a.btn.sm[href^=chat]",
        )
        .forEach((a) =>
          a.addEventListener("click", () => {
            let q =
              a.querySelector("h3")?.textContent ||
              a.textContent.trim().replace(/^\d+\s*/, "");
            store("question", { text: q });
          }),
        );
      document.querySelectorAll("[data-question]").forEach((n) => {
        let d = read("question");
        if (
          d &&
          (!needsPersonalInfo(d.text) ||
            location.pathname.endsWith("/chat-personal.html"))
        )
          n.textContent = d.text;
      });
      if (
        document.body.dataset.role === "visitor" &&
        location.pathname.endsWith("/home.html")
      ) {
        const input = document.querySelector(".composer [name=question]");
        const previous = read("question");
        if (input && previous?.text) input.value = previous.text;
      }
      document.querySelectorAll("[data-rate]").forEach((b) =>
        b.addEventListener("click", () => {
          document
            .querySelectorAll("[data-rate]")
            .forEach((x) => x.classList.remove("primary"));
          b.classList.add("primary");
          store("rating", { value: b.dataset.rate });
          toast("感谢反馈，已记录本次回答评价");
        }),
      );
      document.querySelectorAll("[data-score]").forEach((b) =>
        b.addEventListener("click", () => {
          document
            .querySelectorAll("[data-score]")
            .forEach((x) => x.classList.remove("primary"));
          b.classList.add("primary");
          document.querySelector("[name=score]").value = b.dataset.score;
        }),
      );
      document.querySelectorAll("[data-clear]").forEach((b) =>
        b.addEventListener("click", () => {
          try {
            Object.keys(localStorage)
              .filter((x) => x.startsWith("csu-prototype-"))
              .forEach((x) => localStorage.removeItem(x));
          } catch (e) {}
          if (
            ["后勤知识文件演示：", "后勤服务展示配置："].some((prefix) =>
              window.name.startsWith(prefix),
            )
          )
            window.name = "";
          window.dispatchEvent(new Event("csu-prototype-reset"));
          toast("本地演示数据已重置");
        }),
      );
    </script>

    <script src="../../assets/vendor/qrcode.js"></script>
    <script>
      /* 服务内容发布后同步前台；原型配置仅保存于当前浏览器。 */
      (() => {
        const defaults = window.CSU_SERVICE_DEFAULTS;
        const context = window.CSU_SERVICE_CONTEXT;
        if (!defaults || !context) return;
        const storageKey = "csu-prototype-service-content-v1";
        const carryPrefix = "后勤服务展示配置：";
        const copy = (x) => JSON.parse(JSON.stringify(x));
        const query = new URLSearchParams(location.search);
        const icons = [
          "fa-screwdriver-wrench",
          "fa-comments",
          "fa-person-swimming",
          "fa-file-lines",
          "fa-bus",
          "fa-hotel",
          "fa-newspaper",
          "fa-magnifying-glass",
          "fa-bolt",
          "fa-bullhorn",
        ];
        let state = copy(defaults);
        function load() {
          let saved;
          try {
            saved = JSON.parse(localStorage.getItem(storageKey) || "null");
          } catch (_) {}
          try {
            if (window.name.startsWith(carryPrefix)) {
              const carried = JSON.parse(window.name.slice(carryPrefix.length));
              if (!saved || (carried.updated || 0) > (saved.updated || 0))
                saved = carried;
            }
          } catch (_) {}
          state = {
            ...copy(defaults),
            ...saved,
            display: { ...defaults.display, ...(saved?.display || {}) },
            services: {
              ...copy(defaults.services),
              ...(saved?.services || {}),
            },
          };
        }
        function save() {
          state.updated = Date.now();
          try {
            localStorage.setItem(storageKey, JSON.stringify(state));
          } catch (_) {}
          window.name = carryPrefix + JSON.stringify(state);
        }
        function el(tag, text, cls) {
          const n = document.createElement(tag);
          if (text !== undefined && text !== null) n.textContent = text;
          if (cls) n.className = cls;
          return n;
        }
        function icon(name) {
          const n = el(
            "i",
            null,
            "fa-solid " +
              (icons.includes(name)
                ? name
                : name === "fa-arrow-up-right-from-square"
                  ? name
                  : name === "fa-circle-info"
                    ? name
                    : "fa-circle-info"),
          );
          n.setAttribute("aria-hidden", "true");
          return n;
        }
        function anchor(text, href, cls = "btn") {
          const n = el("a", text, cls);
          n.href = href;
          return n;
        }
        function badge(text, cls = "") {
          return el("span", text, "badge " + cls);
        }
        function note(text) {
          const n = el("div", null, "note service-content-notice");
          n.append(icon("fa-circle-info"), el("div", text));
          return n;
        }
        function card(title) {
          const n = el("section", null, "card");
          if (title) n.append(el("h2", title));
          return n;
        }
        function heading(title, subtitle, action) {
          const n = el("div", null, "page-heading");
          const h = el("div");
          h.append(
            el("div", "中南大学 · 智慧后勤", "eyebrow"),
            el("h1", title),
            el("p", subtitle),
          );
          n.append(h);
          if (action) n.append(action);
          return n;
        }
        function details(items) {
          const n = el("dl", null, "summary-list");
          items.forEach(([label, text]) => {
            const r = el("div");
            r.append(el("dt", label), el("dd", text));
            n.append(r);
          });
          return n;
        }
        function validURL(value) {
          try {
            const u = new URL(value);
            return ["http:", "https:"].includes(u.protocol) ? u.href : "";
          } catch (_) {
            return "";
          }
        }
        function endpoint(s, port) {
          if (s.terminal === "无地址，仅文字说明") return "";
          if (port === "pc" && s.terminal === "仅手机") return "";
          if (port === "mobile" && s.terminal === "仅电脑") return "";
          return validURL(s[port] || "");
        }
        function allowed(s, role = context.role) {
          if (
            role === "visitor" ||
            role === "admin" ||
            s.who === "全部用户（说明）" ||
            s.who === "学生、教职工"
          )
            return true;
          return role === "student"
            ? s.who === "学生"
            : role === "staff"
              ? s.who === "教职工"
              : false;
        }
        function label(s) {
          return (
            {
              电脑与手机分别配置: "电脑、手机",
              仅电脑: "仅电脑",
              仅手机: "仅手机",
              "无地址，仅文字说明": "办事说明",
            }[s.terminal] || s.terminal
          );
        }
        function guideURL(s) {
          if (context.role === "visitor")
            return (
              "login-required.html?intent=service&service=" +
              encodeURIComponent(s.id)
            );
          return defaults.services[s.id]
            ? s.id + ".html"
            : "service-guide.html?service=" + encodeURIComponent(s.id);
        }
        function current(fallback = "repair") {
          return state.services[query.get("service") || fallback];
        }
        function actionFor(s, port) {
          if (endpoint(s, port))
            return [
              s.buttonText,
              "service-handoff.html?service=" + encodeURIComponent(s.id),
            ];
          if (port === "pc" && endpoint(s, "mobile"))
            return [
              s.qrButtonText,
              "service-mobile.html?service=" + encodeURIComponent(s.id),
            ];
          return [
            "查看替代渠道",
            "service-unavailable.html?service=" + encodeURIComponent(s.id),
          ];
        }
        function blocked(host, s) {
          host.replaceChildren(
            heading(state.display.guideTitle, state.display.guideSubtitle),
          );
          const c = card(
            !s
              ? "未找到这项服务"
              : !s.enabled
                ? "服务暂未开放"
                : "当前身份暂不可使用此服务",
          );
          c.append(
            el(
              "p",
              !s
                ? "该服务可能尚未发布，请返回服务大厅选择已开放的服务。"
                : !s.enabled
                  ? "服务当前已停用，请查看其他服务或联系后勤了解办理方式。"
                  : "服务根据适用对象展示，请使用相应校园身份查看办理入口。",
            ),
            anchor("返回服务大厅", "services.html", "btn primary"),
          );
          host.append(c);
        }
        function guide(s, port, { preview = false } = {}) {
          const root = el("div", null, "service-config-guide");
          if (!preview && (!s || !s.enabled || !allowed(s))) {
            blocked(root, s);
            return root;
          }
          root.append(
            heading(
              state.display.guideTitle,
              state.display.guideSubtitle,
              preview ? null : anchor("全部服务", "services.html", "btn sm"),
            ),
          );
          const split = el("div", null, "split-detail");
          const left = el("div"),
            right = el("div");
          const body = card();
          const banner = el("div", null, "detail-banner"),
            si = el("div", null, "service-icon"),
            title = el("div");
          si.append(icon(s.icon));
          title.append(el("h1", s.name), el("p", s.summary));
          banner.append(si, title);
          body.append(
            banner,
            el("p", s.detail, "service-content-body"),
            el("hr", null, "divider"),
            el("h2", "办理步骤"),
          );
          const list = el("div", null, "steps");
          (s.steps || []).forEach((step, i) => {
            const r = el("div", null, "service-content-step"),
              t = el("div");
            t.append(el("h3", step.title), el("p", step.text));
            r.append(el("span", String(i + 1)), t);
            list.append(r);
          });
          body.append(list);
          left.append(body);
          const info = card("办理信息");
          info.append(
            details([
              ["适用对象", s.who],
              ["办理渠道", s.channel],
              ["终端支持", label(s)],
            ]),
          );
          const [text, href] = actionFor(s, port),
            actions = el("div", null, "actions");
          actions.style.marginTop = "22px";
          if (preview) {
            const b = el("button", text, "btn primary");
            b.type = "button";
            b.disabled = true;
            actions.append(b);
          } else actions.append(anchor(text, href, "btn primary"));
          info.append(actions);
          right.append(info, note(s.notice));
          split.append(left, right);
          root.append(split);
          return root;
        }
        function renderCatalog() {
          const host = document.querySelector("[data-service-catalog]");
          if (!host) return;
          const previous =
            host.querySelector("#service-catalog-search")?.value || "";
          host.replaceChildren(
            heading(state.display.hallTitle, state.display.hallSubtitle),
          );
          const filters = el("div", null, "filters"),
            input = el("input");
          input.id = "service-catalog-search";
          input.placeholder = state.display.searchPlaceholder;
          input.setAttribute("aria-label", "搜索服务");
          input.value = previous;
          filters.append(input);
          const grid = el("div", null, "grid3"),
            empty = el(
              "div",
              "暂无匹配服务，请换一个关键词或联系后勤。",
              "card empty",
            );
          grid.id = "service-catalog-grid";
          empty.id = "service-catalog-empty";
          const draw = () => {
            grid.replaceChildren();
            let found = 0;
            Object.values(state.services)
              .sort((a, b) => a.sort - b.sort)
              .filter((s) => s.enabled && s.showInHall && allowed(s))
              .forEach((s) => {
                if (
                  !(s.name + s.summary + s.category + s.triggers).includes(
                    input.value.trim(),
                  )
                )
                  return;
                found++;
                const a = anchor("", guideURL(s), "service-card"),
                  si = el("div", null, "service-icon");
                si.append(icon(s.icon));
                a.append(
                  si,
                  el("h3", s.name),
                  el("p", s.summary),
                  badge(s.tag),
                );
                grid.append(a);
              });
            empty.hidden = found > 0;
          };
          input.addEventListener("input", draw);
          host.append(filters, grid, empty);
          draw();
        }
        function renderRoutes() {
          document.querySelectorAll("[data-service-guide]").forEach((host) => {
            const id = host.dataset.serviceGuide;
            const s =
              state.services[
                id === "query" ? query.get("service") || "repair" : id
              ];
            host.replaceChildren(guide(s, context.port));
          });
          const handoff = document.querySelector("[data-service-handoff]");
          if (handoff) {
            const s = current(handoff.dataset.serviceHandoff || "repair");
            if (!s || !s.enabled || !allowed(s)) {
              blocked(handoff, s);
              return;
            }
            const url = endpoint(s, context.port);
            handoff.replaceChildren(
              heading("即将前往官方服务", "请在原业务系统内完成后续操作"),
            );
            const c = card(s.name);
            c.append(
              details([
                ["办理渠道", s.channel],
                ["适用对象", s.who],
                ["访问地址", url || "当前终端未配置可用地址"],
                ["办理记录", "在原业务系统查看"],
              ]),
            );
            const actions = el("div", null, "actions");
            actions.style.marginTop = "25px";
            if (url) actions.append(anchor("打开官方服务", url, "btn primary"));
            else {
              const [text, href] = actionFor(s, context.port);
              actions.append(anchor(text, href, "btn primary"));
            }
            actions.append(anchor("返回服务指引", guideURL(s)));
            c.append(actions);
            handoff.append(c, note(s.notice));
          }
          const qrHost = document.querySelector("[data-service-qr]");
          if (qrHost) {
            const s = current("utility-pay");
            if (!s || !s.enabled || !allowed(s)) {
              blocked(qrHost, s);
              return;
            }
            const url = endpoint(s, "mobile");
            qrHost.replaceChildren(
              heading(s.name + "，请在手机上办理", s.summary),
            );
            const c = card("使用手机打开官方服务");
            if (url) {
              const box = el("div", null, "service-qr");
              if (window.qrcode) {
                try {
                  const qr = qrcode(0, "M");
                  qr.addData(url);
                  qr.make();
                  box.innerHTML = qr.createSvgTag({
                    cellSize: 5,
                    margin: 12,
                    scalable: true,
                  });
                  box
                    .querySelector("svg")
                    ?.setAttribute("aria-label", s.name + "官方服务地址二维码");
                } catch (_) {
                  box.textContent =
                    "二维码暂时不可用，请在手机中打开下方地址。";
                }
              } else
                box.textContent = "二维码暂时不可用，请在手机中打开下方地址。";
              const caption = el("p", url, "service-content-link");
              caption.style.textAlign = "center";
              c.append(
                box,
                caption,
                el("p", "扫码后，按原业务平台要求登录并完成办理。"),
              );
            } else
              c.append(
                el("p", "当前未配置可用的手机地址，请联系后勤了解办理方式。"),
              );
            c.append(anchor("返回服务指引", guideURL(s)));
            qrHost.append(c, note(s.notice));
          }
          const unavailable = document.querySelector(
            "[data-service-unavailable]",
          );
          if (unavailable) {
            const s = current("announcement");
            if (!s || !s.enabled || !allowed(s)) {
              blocked(unavailable, s);
              return;
            }
            unavailable.replaceChildren(
              heading("换一种方式，继续办理", s.name),
            );
            const c = card("当前终端暂未提供办理地址");
            c.append(
              el("p", s.fallbackText, "service-content-body"),
              el("p", s.detail, "service-content-body"),
            );
            const actions = el("div", null, "actions");
            actions.append(
              anchor("联系后勤", "contacts.html", "btn primary"),
              anchor("返回服务指引", guideURL(s)),
            );
            c.append(actions);
            unavailable.append(c, note(s.notice));
          }
        }
        function updateShortcuts() {
          if (context.role === "admin") return;
          document.querySelectorAll("a[href]").forEach((a) => {
            const url = new URL(a.getAttribute("href"), location.href);
            if (url.origin !== location.origin) return;
            const page = url.pathname
              .split("/")
              .pop()
              .replace(/\.html$/, "");
            const id = [
              "login-required",
              "service-guide",
              "service-handoff",
              "service-mobile",
              "service-unavailable",
            ].includes(page)
              ? url.searchParams.get("service")
              : page;
            const s = state.services[id];
            if (!s) return;
            if (a.closest(".sidebar,.bottom-nav,.topbar")) return;
            a.hidden = !s.enabled || !allowed(s);
            if (a.hidden) return;
            if (context.role === "visitor") a.href = guideURL(s);
            if (a.matches("a.quick,.mini-apps a"))
              a.replaceChildren(icon(s.icon), document.createTextNode(s.name));
          });
          document.querySelectorAll(".quick-grid").forEach((grid) => {
            const count = [...grid.children].filter((a) => !a.hidden).length;
            grid.hidden = count === 0;
            if (count)
              grid.style.gridTemplateColumns =
                "repeat(" + Math.min(4, count) + ", minmax(0, 1fr))";
          });
        }
        function renderAdminList() {
          const host = document.querySelector("#admin-service-content-list");
          if (!host) return;
          const text =
            document.querySelector("#admin-service-search")?.value.trim() || "";
          host.replaceChildren();
          Object.values(state.services)
            .sort((a, b) => a.sort - b.sort)
            .filter((s) => (s.name + s.category + s.who).includes(text))
            .forEach((s) => {
              const row = el("tr"),
                name = el("td");
              name.append(el("strong", s.name), el("p", s.summary));
              const status = el("td");
              status.append(
                badge(
                  s.enabled ? "启用" : "停用",
                  s.enabled ? "green" : "gray",
                ),
              );
              const operation = el("td");
              operation.append(
                anchor(
                  "配置内容",
                  "service-edit.html?service=" + encodeURIComponent(s.id),
                  "textlink",
                ),
              );
              row.append(
                name,
                el("td", s.category),
                el("td", s.who),
                status,
                el("td", String(s.sort)),
                operation,
              );
              host.append(row);
            });
          if (!host.children.length) {
            const tr = el("tr"),
              td = el("td", "暂无匹配服务", "service-admin-empty");
            td.colSpan = 6;
            tr.append(td);
            host.append(tr);
          }
        }
        const collectSteps = () =>
          [
            ...document.querySelectorAll(
              "#service-steps-editor [data-service-step]",
            ),
          ].map((row) => ({
            title: row.querySelector("[data-step-title]").value.trim(),
            text: row.querySelector("[data-step-text]").value.trim(),
          }));
        function drawSteps(steps) {
          const host = document.querySelector("#service-steps-editor");
          host.replaceChildren();
          steps.forEach((step, i) => {
            const row = el("div", null, "service-step-edit");
            row.dataset.serviceStep = "";
            const order = el("div", null, "service-step-order"),
              actions = el("div", null, "actions");
            order.append(el("strong", "步骤 " + (i + 1)));
            const control = (text, action, disabled = false) => {
              const b = el("button", text, "btn sm");
              b.type = "button";
              b.disabled = disabled;
              b.addEventListener("click", action);
              return b;
            };
            actions.append(
              control(
                "上移",
                () => {
                  const data = collectSteps();
                  [data[i - 1], data[i]] = [data[i], data[i - 1]];
                  drawSteps(data);
                },
                i === 0,
              ),
              control(
                "下移",
                () => {
                  const data = collectSteps();
                  [data[i + 1], data[i]] = [data[i], data[i + 1]];
                  drawSteps(data);
                },
                i === steps.length - 1,
              ),
              control(
                "删除",
                () => {
                  const data = collectSteps();
                  data.splice(i, 1);
                  drawSteps(data);
                },
                steps.length === 1,
              ),
            );
            order.append(actions);
            const titleField = el("div", null, "field"),
              titleLabel = el("label", "步骤标题 *"),
              title = el("input");
            title.id = "step-title-" + i;
            title.dataset.stepTitle = "";
            titleLabel.htmlFor = title.id;
            title.value = step.title;
            title.maxLength = 60;
            title.required = true;
            titleField.append(titleLabel, title);
            const bodyField = el("div", null, "field"),
              bodyLabel = el("label", "步骤说明 *"),
              body = el("textarea");
            body.id = "step-text-" + i;
            body.dataset.stepText = "";
            bodyLabel.htmlFor = body.id;
            body.value = step.text;
            body.rows = 3;
            body.required = true;
            body.maxLength = 1000;
            bodyField.append(bodyLabel, body);
            row.append(order, titleField, bodyField);
            host.append(row);
          });
        }
        function editForm() {
          const form = document.querySelector("#service-content-form");
          if (!form) return;
          const newMode = query.has("new");
          const id = query.get("service") || "repair";
          let s;
          if (
            state.draft &&
            (state.draft.id === id || (newMode && state.draft.isNew))
          )
            s = copy(state.draft);
          else if (newMode)
            s = {
              ...copy(defaults.services.repair),
              id: "service-" + Date.now(),
              name: "",
              summary: "",
              detail: "",
              pc: "",
              mobile: "",
              triggers: "",
              sort: Object.keys(state.services).length + 1,
              terminal: "无地址，仅文字说明",
              steps: [{ title: "了解办事说明", text: "" }],
              isNew: true,
            };
          else s = copy(state.services[id] || defaults.services.repair);
          form.querySelectorAll("[name]").forEach((n) => {
            if (s[n.name] !== undefined)
              n.value = ["enabled", "showInHall"].includes(n.name)
                ? s[n.name]
                  ? "是"
                  : "否"
                : String(s[n.name]);
          });
          drawSteps(s.steps);
          document
            .querySelector("#add-service-step")
            .addEventListener("click", () => {
              const data = collectSteps();
              if (data.length >= 12) {
                if (typeof toast === "function")
                  toast("每项服务最多设置12个办理步骤");
                return;
              }
              data.push({ title: "", text: "" });
              drawSteps(data);
            });
          form.addEventListener("submit", (e) => {
            e.preventDefault();
            const d = Object.fromEntries(new FormData(form));
            const data = {
              ...s,
              ...d,
              enabled: d.enabled === "是",
              showInHall: d.showInHall === "是",
              sort: Number(d.sort),
              steps: collectSteps(),
            };
            let error = "";
            if (
              !data.name.trim() ||
              !data.summary.trim() ||
              !data.detail.trim()
            )
              error = "请完整填写服务名称、卡片简介和详细说明。";
            else if (!icons.includes(data.icon))
              error = "请选择支持的服务图标。";
            else if (
              !Number.isInteger(data.sort) ||
              data.sort < 0 ||
              data.sort > 999
            )
              error = "排序请输入0至999的整数。";
            else if (
              !data.steps.length ||
              data.steps.some((x) => !x.title || !x.text)
            )
              error = "请完整填写每个办理步骤的标题和说明。";
            else if (
              data.terminal === "电脑与手机分别配置" &&
              (!validURL(data.pc) || !validURL(data.mobile))
            )
              error = "两端均可办理时，请分别填写有效的电脑和手机地址。";
            else if (data.terminal === "仅电脑" && !validURL(data.pc))
              error = "请填写有效的电脑正式地址。";
            else if (data.terminal === "仅手机" && !validURL(data.mobile))
              error = "请填写有效的手机正式地址。";
            document.querySelector("#service-form-error").textContent = error;
            if (error) return;
            state.draft = data;
            save();
            location.href =
              "service-preview.html?service=" + encodeURIComponent(data.id);
          });
        }
        function previews() {
          const pc = document.querySelector("#service-content-preview-pc"),
            mobile = document.querySelector("#service-content-preview-mobile");
          if (pc && mobile) {
            const id = query.get("service") || "repair";
            const s =
              (state.draft?.id === id ? state.draft : null) ||
              current() ||
              defaults.services.repair;
            const previewFor = (port) => {
              const root = el("div");
              root.append(el("h3", "服务大厅卡片"));
              const tile = el("div", null, "service-card"),
                si = el("div", null, "service-icon");
              si.append(icon(s.icon));
              tile.append(
                si,
                el("h3", s.name),
                el("p", s.summary),
                badge(s.tag),
              );
              root.append(
                tile,
                el(
                  "p",
                  `${s.enabled ? "已启用" : "已停用"} · ${s.showInHall ? "在大厅展示" : "不在大厅展示"} · ${s.who} · 排序 ${s.sort}`,
                  "service-publish-summary",
                ),
                guide(s, port, { preview: true }),
              );
              return root;
            };
            pc.replaceChildren(previewFor("pc"));
            const phone = el("div", null, "service-preview-phone");
            phone.append(previewFor("mobile"));
            mobile.replaceChildren(phone);
            document.querySelector("#service-back-edit").href =
              "service-edit.html?service=" + encodeURIComponent(s.id);
            document
              .querySelector("#service-content-confirm")
              .addEventListener("submit", (e) => {
                e.preventDefault();
                state.services[s.id] = copy(s);
                delete state.services[s.id].isNew;
                delete state.draft;
                save();
                location.href =
                  "service-saved.html?service=" + encodeURIComponent(s.id);
              });
          }
          const name = document.querySelector("#service-saved-name");
          if (name) {
            const s = current();
            name.textContent = s?.name || "服务内容";
            if (s) {
              const role = s.who === "教职工" ? "staff" : "student";
              document.querySelector("#service-view-pc").href =
                "../../" + role + "/pc/" + guideURL(s);
              document.querySelector("#service-view-mobile").href =
                "../../" + role + "/mobile/" + guideURL(s);
            }
          }
        }
        function displayForm() {
          const form = document.querySelector("#service-display-form");
          if (form) {
            const data = state.draftDisplay || state.display;
            form
              .querySelectorAll("[name]")
              .forEach((n) => (n.value = data[n.name] || ""));
            form.addEventListener("submit", (e) => {
              e.preventDefault();
              state.draftDisplay = Object.fromEntries(new FormData(form));
              save();
              location.href = "service-display-preview.html";
            });
          }
          const host = document.querySelector("#service-display-preview");
          if (host) {
            const d = state.draftDisplay || state.display;
            host.replaceChildren(heading(d.hallTitle, d.hallSubtitle));
            const input = el("input");
            input.placeholder = d.searchPlaceholder;
            input.disabled = true;
            host.append(
              input,
              el("hr", null, "divider"),
              heading(d.guideTitle, d.guideSubtitle),
            );
            document
              .querySelector("#service-display-confirm")
              .addEventListener("submit", (e) => {
                e.preventDefault();
                state.display = { ...d };
                delete state.draftDisplay;
                save();
                location.href = "service-display-saved.html";
              });
          }
        }
        function front() {
          renderCatalog();
          renderRoutes();
          updateShortcuts();
        }
        load();
        document.addEventListener("DOMContentLoaded", () => {
          front();
          renderAdminList();
          editForm();
          previews();
          displayForm();
          document
            .querySelector("#admin-service-search")
            ?.addEventListener("input", renderAdminList);
        });
        window.addEventListener("storage", (e) => {
          if (e.key === storageKey) {
            load();
            front();
            renderAdminList();
          }
        });
        window.addEventListener("csu-prototype-reset", () => {
          state = copy(defaults);
          front();
          renderAdminList();
        });
        window.addEventListener("pageshow", () => {
          load();
          front();
          renderAdminList();
        });
      })();
    </script>
  </body>
</html>
